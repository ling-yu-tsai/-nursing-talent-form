<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>已送出 - 護理人員專長招募表單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;500;700&family=Chiron+Sung+HK:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F3EC;
    --ink: #24302E;
    --pine: #1F5C56;
    --pine-soft: #E8EFEC;
    --line: #D9D3C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Chiron Hei HK", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }

  .card {
    max-width: 440px;
    width: 100%;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-left: 4px solid var(--pine);
    border-radius: 4px;
    padding: 40px 28px;
    text-align: center;
  }

  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--pine-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 28px;
    height: 28px;
  }

  h1 {
    font-family: "Chiron Sung HK", "Georgia", serif;
    font-size: 22px;
    color: var(--pine);
    margin: 0 0 12px;
  }

  p {
    font-size: 15px;
    line-height: 1.7;
    color: #5B6864;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1F5C56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>已收到您的資料</h1>
    <p>感謝您填寫護理人員專長招募表單,我們已將資料收錄進人才資料庫。<br>如有任何問題,請與護理部承辦人員聯繫。</p>
  </div>

</body>
</html>
